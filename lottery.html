<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Lottery Wheel UI</title>
    <link rel="stylesheet" href="./lottery.css">
</head>
<body>

    <div class="container">
        <h1>Lucky Draw Lottery Wheel</h1>
        
        <div class="wheel-wrapper">
            <div id="wheelCanvas" role="img" aria-label="3D lottery wheel"></div>
        </div>

        <label class="set-size-control" for="setSize">
            Numbers on wheel
            <input id="setSize" type="number" min="1" max="50" value="50">
        </label>
        <button class="spin-btn" id="spinBtn">SPIN WHEEL</button>
        <div class="result-display" id="resultDisplay">Set the wheel range and spin.</div>
    </div>

    <div class="winner-overlay" id="winnerOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerMessage" hidden>
        <div class="winner-content">
            <p class="winner-message" id="winnerMessage">Congratulations!</p>
            <strong class="winner-number" id="winnerNumber"></strong>
            <button class="spin-btn" id="closeWinnerButton">BACK TO WHEEL</button>
        </div>
    </div>

    <script type="module" src="./lottery.js"></script>
</body>
</html>
