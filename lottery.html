<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Lottery Wheel UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #38bdf8;
        }

        .wheel-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 20px auto;
        }

        /* Pointer at the top */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #f43f5e;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            border: 6px solid #334155;
        }

        .spin-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            letter-spacing: 1px;
        }

        .spin-btn:hover {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .set-size-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 0 16px;
            font-size: 1rem;
        }

        .set-size-control input {
            width: 72px;
            padding: 8px;
            border: 1px solid #64748b;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            font: inherit;
            text-align: center;
        }

        .set-size-control input:disabled {
            opacity: 0.65;
        }

        .result-display {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 30px;
            color: #a7f3d0;
            line-height: 1.5;
        }

        .winner-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(8, 15, 30, 0.97);
            text-align: center;
        }

        .winner-overlay[hidden] {
            display: none;
        }

        .winner-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .winner-message {
            color: #a7f3d0;
            font-size: 2rem;
            font-weight: 700;
        }

        .winner-number {
            color: #fbbf24;
            font-size: 12rem;
            font-weight: 800;
            line-height: 1;
        }

        @media (max-width: 480px) {
            .winner-number {
                font-size: 8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lucky Draw Lottery Wheel</h1>
        
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>

        <label class="set-size-control" for="setSize">
            Numbers on wheel
            <input id="setSize" type="number" min="1" max="50" value="50">
        </label>
        <button class="spin-btn" id="spinBtn">SPIN WHEEL</button>
        <div class="result-display" id="resultDisplay">Set the wheel range and spin.</div>
    </div>

    <div class="winner-overlay" id="winnerOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerMessage" hidden>
        <div class="winner-content">
            <p class="winner-message" id="winnerMessage">Congratulations!</p>
            <strong class="winner-number" id="winnerNumber"></strong>
            <button class="spin-btn" id="closeWinnerButton">BACK TO WHEEL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const setSizeInput = document.getElementById('setSize');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerNumber = document.getElementById('winnerNumber');
        const closeWinnerButton = document.getElementById('closeWinnerButton');

        const colors = ["#ef4444", "#f59e0b", "#10b981", "#06b6d4", "#8b5cf6", "#ec4899"];
        let totalSlices = Number(setSizeInput.value);
        let prizes = [];
        let arcSize = 0;
        let currentAngle = 0;
        let isSpinning = false;

        function updateWheel() {
            const numberCount = Number(setSizeInput.value);
            if (!Number.isInteger(numberCount) || numberCount < 1 || numberCount > 50) {
                resultDisplay.textContent = "Enter a whole number from 1 to 50.";
                return false;
            }

            totalSlices = numberCount;
            arcSize = (2 * Math.PI) / totalSlices;
            prizes = Array.from({ length: totalSlices }, (_, index) => ({
                name: String(index + 1),
                color: colors[index % colors.length]
            }));
            drawWheel();
            resultDisplay.textContent = `Wheel numbers: 1-${totalSlices}`;
            return true;
        }

        // Draw the wheel slices onto the canvas
        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(currentAngle);

            for (let i = 0; i < totalSlices; i++) {
                const angle = i * arcSize;

                // Draw slice background
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 5, angle, angle + arcSize);
                ctx.closePath();
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw text label
                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${Math.max(8, Math.min(18, 260 / totalSlices))}px sans-serif`;
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(prizes[i].name, radius - (totalSlices > 20 ? 18 : 30), 4);
                ctx.restore();
            }

            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning || !updateWheel()) return;

            isSpinning = true;
            spinBtn.disabled = true;
            setSizeInput.disabled = true;
            resultDisplay.textContent = "Spinning...";

            const extraRounds = Math.floor(Math.random() * 5) + 5;
            const randomExtraRad = Math.random() * (2 * Math.PI);
            const startAngle = currentAngle;
            const endAngle = startAngle + extraRounds * 2 * Math.PI + randomExtraRad;
            const startTime = performance.now();
            const duration = 4000;

            function animateSpin(currentTime) {
                const progress = Math.min((currentTime - startTime) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (endAngle - startAngle) * easeOut;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    determineWinner();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    setSizeInput.disabled = false;
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function determineWinner() {
            const normalizedAngle = currentAngle % (2 * Math.PI);
            const pointerOffset = (3 * Math.PI / 2 - normalizedAngle) % (2 * Math.PI);
            const positiveOffset = (pointerOffset + 2 * Math.PI) % (2 * Math.PI);
            const winningIndex = Math.floor(positiveOffset / arcSize) % totalSlices;
            winnerNumber.textContent = prizes[winningIndex].name;
            winnerOverlay.hidden = false;
            closeWinnerButton.focus();
        }

        updateWheel();

        setSizeInput.addEventListener('input', updateWheel);
        spinBtn.addEventListener('click', spinWheel);
        closeWinnerButton.addEventListener('click', () => {
            winnerOverlay.hidden = true;
            spinBtn.focus();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !winnerOverlay.hidden) {
                winnerOverlay.hidden = true;
                spinBtn.focus();
            }
        });
    </script>
</body>
</html>
